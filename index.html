<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>منو کافه</title>

<style>
/* ==== CSS اینجاست ==== */

body{
    background:#111;
    font-family: Tahoma;
    direction: rtl;
    margin:0;
}

.container{
    width:90%;
    margin:auto;
}

.top-menu{
    display:flex;
    gap:10px;
    margin:20px 0;
}

.menu-btn{
    background:#222;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

.menu-list table{
    width:100%;
    border-spacing:15px;
}

.item{
    background:#1c1c1c;
    border-radius:10px;
}

.item td{
    padding:15px;
}

.img img{
    width:90px;
    border-radius:10px;
}

.info h3{
    color:white;
    margin:0;
}

.info p{
    color:gray;
}

.price{
    color:orange;
}

.buy-btn{
    background:#00c853;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:8px;
}
</style>

</head>
<body>

<div class="container">

    <div class="top-menu">
        <div class="menu-btn">نوشیدنی گرم</div>
        <div class="menu-btn">نوشیدنی سرد</div>
        <div class="menu-btn">پیش غذا</div>
        <div class="menu-btn">دسر</div>
    </div>

    <div class="menu-list">
        <table>

            <tr class="item">
                <td class="img">
                    <img src="images/espresso.jpg">
                </td>

                <td class="info">
                    <h3>قهوه اسپرسو</h3>
                    <p>قهوه خالص ایتالیایی</p>
                    <span class="price">80,000 تومان</span>
                </td>

                <td>
                    <a href="https://snappfood.ir" class="buy-btn">خرید</a>
                </td>
            </tr>

        </table>
    </div>

</div>

</body>
</html>
