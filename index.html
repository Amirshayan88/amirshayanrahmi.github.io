<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title> منوی رستوران</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Sahel:wght@600;700&display=swap');

body{
    background:#111;
    font-family:'Vazirmatn', sans-serif;
    direction:rtl;
    margin:0;
    color:white;
    font-size:18px;
}

.container{width:95%;margin:auto;}

.top-menu{
    display:flex;
    gap:20px;
    margin:30px 0;
}

.menu-btn{
    background:#222;
    padding:18px 30px;
    border-radius:12px;
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:700;
}

table{width:100%;border-spacing:20px;}
.item{background:#1c1c1c;border-radius:15px;}
.item td{padding:15px;}

.img img{width:120px;border-radius:12px;}

.food-name{
    font-family:'Sahel', sans-serif;
    font-size:22px;
    font-weight:700;
}

.food-desc{color:#bbb;font-size:16px;}
.price{color:#ffb300;font-weight:bold;}

.buy-btn{
    background:#00c853;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<div class="top-menu">
    <a class="menu-btn" href="index.html">منوی رستوران</a>

</div>

<table>

<td><a class="buy-btn" href="https://snappfood.ir">خرید</a></td>
</tr>

<tr class="item">
<td class="img"><img src="images/double-burger.jpg"></td>
