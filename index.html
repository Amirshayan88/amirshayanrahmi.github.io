<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>غذاهای اصلی</title>

<style>
body{
    background:#111;
    font-family: Tahoma;
    direction: rtl;
    margin:0;
    color:white;
}

.container{
    width:95%;
    margin:auto;
}

/* هدر */
.header{
    margin:20px 0;
}

.back{
    color:orange;
    text-decoration:none;
}

/* جدول */
table{
    width:100%;
    border-spacing:15px;
}

.item{
    background:#1c1c1c;
    border-radius:10px;
}

.item td{
    padding:15px;
}

.img img{
    width:100px;
    border-radius:10px;
}

.price{
    color:#ffb300;
}

.buy-btn{
    background:#00c853;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <a href="index.html" class="back">⬅ بازگشت به منو</a>
    <h2>غذاهای اصلی</h2>
</div>

<table>

<tr class="item">
<td class="img"><img src="images/burger.jpg"></td>
<td>
<h3>برگر مخصوص</h3>
<p>گوشت گریل شده با پنیر</p>
<span class="price">250,000 تومان</span>
</td>
<td>
<a href="https://snappfood.ir" class="buy-btn">خرید</a>
</td>
</tr>

<tr class="item">
<td class="img"><img src="images/pizza.jpg"></td>
<td>
<h3>پیتزا پپرونی</h3>
<p>پنیر موزارلا و پپرونی</p>
<span class="price">320,000 تومان</span>
</td>
<td>
<a href="https://snappfood.ir" class="buy-btn">خرید</a>
</td>
</tr>

<tr class="item">
<td class="img"><img src="images/pasta.jpg"></td>
<td>
<h3>پاستا آلفردو</h3>
<p>سس خامه و مرغ</p>
<span class="price">280,000 تومان</span>
</td>
<td>
<a href="https://snappfood.ir" class="buy-btn">خرید</a>
</td>
</tr>

<tr class="item">
<td class="img"><img src="images/steak.jpg"></td>
<td>
<h3>استیک گوشت</h3>
<p>گوشت گریل شده مخصوص</p>
<span class="price">420,000 تومان</span>
</td>
<td>
<a href="https://snappfood.ir" class="buy-btn">خرید</a>
</td>
</tr>

</table>

</div>

</body>
</html>
